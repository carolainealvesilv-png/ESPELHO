<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Espelho </title>

<style>
body {
  margin: 0;
  background: black;
  color: white;
  font-family: Arial, sans-serif;
  overflow: hidden;
}

video {
  width: 100vw;
  height: 100vh;
  object-fit: cover;
}

.texto {
  position: absolute;
  bottom: 40px;
  width: 100%;
  text-align: center;
  font-size: 20px;
  padding: 0 20px;
}
</style>

</head>
<body>

<video autoplay playsinline></video>

<div class="texto">
  Esse é você.<br>
  <br>
  Quem está vivendo em você hoje?
</div>

<script>
navigator.mediaDevices.getUserMedia({
  video: { facingMode: "user" },
  audio: false
})
.then(stream => {
  document.querySelector("video").srcObject = stream;
})
.catch(() => {
  alert("Permita o acesso à câmera para continuar.");
});
</script>

</body>
</html>
